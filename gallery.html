<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Photo Gallery</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .lightbox img {
      max-width: 95%;
      max-height: 90%;
      border-radius: 12px;
    }

    .lightbox.open {
      display: flex;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <main class="wrap">

    <!-- HEADER -->
    <section class="hero">
      <h1 class="names">
        Photo Gallery
      </h1>

      <p class="subtitle">
        Photos shared by guests 💛
      </p>
    </section>

    <!-- BACK LINK -->
    <a href="index.html" class="nav-card">
      ← Back to upload
    </a>

    <!-- GALLERY -->
    <section class="panel">

      <div id="summary" class="subtitle">Loading photos...</div>

      <div id="grid" class="grid"></div>

      <div id="empty" class="subtitle" style="display:none;">
        No photos yet
      </div>

    </section>

  </main>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox">
    <button class="close" id="closeBtn">×</button>
    <img id="lightboxImage" />
  </div>

  <!-- SCRIPT -->
  <script>
    const API = "https://wedding-photo-upload.matt-c43.workers.dev";

    const grid = document.getElementById("grid");
    const summary = document.getElementById("summary");
    const empty = document.getElementById("empty");

    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");

    function openLightbox(src) {
      lightboxImage.src = src;
      lightbox.classList.add("open");
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightboxImage.src = "";
    }

    document.getElementById("closeBtn").addEventListener("click", closeLightbox);

    lightbox.addEventListener("click", e => {
      if (e.target === lightbox) closeLightbox();
    });

    function formatDate(date) {
      const d = new Date(date);
      return d.toLocaleString();
    }

    async function loadGallery() {
      try {
        const res = await fetch(API + "/api/gallery");
        const data = await res.json();

        if (!res.ok) throw new Error("Failed to load");

        summary.textContent = data.photos.length + " photo(s)";

        if (!data.photos.length) {
          empty.style.display = "block";
          return;
        }

        data.photos.forEach(photo => {
          const card = document.createElement("div");
          card.className = "card";

          const img = document.createElement("img");
          img.src = photo.url;
          img.loading = "lazy";

          img.addEventListener("click", () => {
            openLightbox(photo.url);
          });

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = (photo.guestName || "Guest") + " • " + formatDate(photo.uploadedAt);

          card.appendChild(img);
          card.appendChild(meta);

          grid.appendChild(card);
        });

      } catch (err) {
        summary.textContent = "Error loading gallery";
      }
    }

    loadGallery();
  </script>

</body>
</html>
