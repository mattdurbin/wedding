<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Messages | Kimberley & Matthew</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="wrap">

    <section class="hero">
      <h1 class="names">
        Guest Messages
      </h1>

      <p class="subtitle">
        Kind words, memories, and messages from our guests 💛
      </p>
    </section>

    <a href="index.html" class="nav-card">
      <div class="nav-title">← Back to upload</div>
      <div class="nav-copy">Share a message, photo, or video</div>
    </a>

    <section class="panel">
      <div id="summary" class="subtitle">Loading messages...</div>
      <div id="messagesList"></div>
      <div id="empty" class="subtitle" style="display:none; margin-top: 16px;">
        No messages yet
      </div>
    </section>

    <div class="footer">
      Thank you for being part of our day 💛
    </div>

  </main>

  <script>
    const API = "https://wedding-photo-upload.matt-c43.workers.dev";

    const summary = document.getElementById("summary");
    const messagesList = document.getElementById("messagesList");
    const empty = document.getElementById("empty");

    function formatDate(dateString) {
      const d = new Date(dateString);
      if (isNaN(d)) return "";
      return d.toLocaleString();
    }

    async function loadMessages() {
      try {
        const res = await fetch(API + "/api/messages");
        const data = await res.json();

        if (!res.ok) throw new Error("Failed to load messages");

        const messages = data.messages || [];
        summary.textContent = messages.length + " message(s)";

        if (!messages.length) {
          empty.style.display = "block";
          return;
        }

        messages.forEach(item => {
          const card = document.createElement("div");
          card.className = "message-card";

          const name = document.createElement("div");
          name.className = "message-name";
          name.textContent = item.guestName || "Guest";

          const date = document.createElement("div");
          date.className = "message-date";
          date.textContent = formatDate(item.uploadedAt);

          const text = document.createElement("div");
          text.className = "message-text";
          text.textContent = item.message || "";

          card.appendChild(name);
          card.appendChild(date);

          if (item.message) {
            card.appendChild(text);
          }

          if (item.filesCount) {
            const files = document.createElement("div");
            files.className = "message-date";
            files.style.marginTop = "10px";

            let tags = [];
            if (item.hasPhotos) tags.push("Photos included");
            if (item.hasVideos) tags.push("Videos included");
            if (!tags.length) tags.push(item.filesCount + " file(s) attached");

            files.textContent = tags.join(" • ");
            card.appendChild(files);
          }

          messagesList.appendChild(card);
        });

      } catch (err) {
        summary.textContent = "Error loading messages";
      }
    }

    loadMessages();
  </script>
</body>
</html>
