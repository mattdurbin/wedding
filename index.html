<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Kimberley & Matthew</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="wrap">

    <!-- HERO -->
    <section class="hero">
      <h1 class="names">
        Kimberley Mason
        <span class="amp">&amp;</span>
        Matthew Alexander Durbin
      </h1>

      <div class="date">20th June 2026</div>

      <p class="subtitle">
        Share your photos and messages with us 💛
      </p>
    </section>

    <!-- NAV -->
    <a href="gallery.html" class="nav-card">
      <div class="nav-title">📷 View photo gallery</div>
      <div class="nav-copy">See all uploaded photos</div>
    </a>

    <a href="messages.html" class="nav-card">
      <div class="nav-title">💬 Read messages</div>
      <div class="nav-copy">View messages from guests</div>
    </a>

    <!-- UPLOAD PANEL -->
    <section class="panel">

      <form id="uploadForm">

        <!-- FILE INPUT -->
        <input
          id="mediaFiles"
          name="media"
          type="file"
          accept="image/*,video/*"
          multiple
        />

        <div id="dropzone" class="dropzone">
          📷 Tap to upload photos or videos
        </div>

        <!-- FORM FIELDS -->
        <div class="fields">
          <input id="guestName" name="guestName" type="text" placeholder="Your name (optional)" />
          <input id="contact" name="contact" type="text" placeholder="Email or phone (optional)" />
          <textarea id="message" name="message" placeholder="Leave us a message 💛"></textarea>
        </div>

        <!-- PREVIEWS -->
        <div id="previews" class="previews"></div>

        <!-- ACTIONS -->
        <div style="margin-top:16px">
          <button id="submitBtn" class="button" type="submit">
            Send
          </button>
          <div id="selection">No files selected</div>
        </div>

        <!-- STATUS -->
        <div id="status" class="status"></div>

      </form>

    </section>

    <!-- FOOTER -->
    <div class="footer">
      Thank you for being part of our day 💛
    </div>

  </main>

  <!-- SCRIPT -->
  <script>
    const API = "https://wedding-photo-upload.matt-c43.workers.dev";

    const input = document.getElementById("mediaFiles");
    const dropzone = document.getElementById("dropzone");
    const previews = document.getElementById("previews");
    const form = document.getElementById("uploadForm");
    const status = document.getElementById("status");
    const selection = document.getElementById("selection");

    function setStatus(type, msg) {
      status.className = "status " + type;
      status.textContent = msg;
    }

    function clearStatus() {
      status.className = "status";
      status.textContent = "";
    }

    function previewFiles(files) {
      previews.innerHTML = "";

      if (!files.length) {
        selection.textContent = "No files selected";
        return;
      }

      selection.textContent = files.length + " file(s) selected";

      Array.from(files).forEach(file => {
        const div = document.createElement("div");
        div.className = "preview";

        let el;

        if (file.type.startsWith("image/")) {
          el = document.createElement("img");
          const reader = new FileReader();
          reader.onload = e => el.src = e.target.result;
          reader.readAsDataURL(file);
        } else if (file.type.startsWith("video/")) {
          el = document.createElement("video");
          el.src = URL.createObjectURL(file);
          el.muted = true;
        } else {
          el = document.createElement("div");
          el.textContent = "🎞️";
        }

        div.appendChild(el);
        previews.appendChild(div);
      });
    }

    input.addEventListener("change", () => {
      previewFiles(input.files);
    });

    dropzone.addEventListener("click", () => input.click());

    dropzone.addEventListener("dragover", e => {
      e.preventDefault();
    });

    dropzone.addEventListener("drop", e => {
      e.preventDefault();
      input.files = e.dataTransfer.files;
      previewFiles(input.files);
    });

    form.addEventListener("submit", async e => {
      e.preventDefault();
      clearStatus();

      const files = input.files;
      const message = document.getElementById("message").value.trim();
      const guestName = document.getElementById("guestName").value.trim();
      const contact = document.getElementById("contact").value.trim();

      if (!files.length && !message && !guestName && !contact) {
        setStatus("error", "Please upload something or leave a message");
        return;
      }

      const data = new FormData();

      Array.from(files).forEach(f => data.append("media", f));
      data.append("guestName", guestName);
      data.append("contact", contact);
      data.append("message", message);

      try {
        const res = await fetch(API + "/api/upload", {
          method: "POST",
          body: data
        });

        if (!res.ok) throw new Error("Upload failed");

        form.reset();
        previews.innerHTML = "";
        selection.textContent = "No files selected";

        setStatus("success", "Thank you! 💛");

      } catch (err) {
        setStatus("error", err.message);
      }
    });

  </script>

</body>
</html>
